version: 2
updates:
  # The kernel has no runtime dependencies; the app and the shell do.
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Types for a node far newer than the floor we run on would let you call
      # an api that is not there, and it still compiles, so it never surfaces.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # A react or vite bump is one review, not four.
      frontend:
        patterns: ["react", "react-dom", "vite", "vitest", "tailwindcss", "@tailwindcss/*"]
    commit-message:
      prefix: "chore(app)"

  - package-ecosystem: npm
    directory: /electron
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Electron and electron-builder move together and break together.
      electron:
        patterns: ["electron", "electron-builder", "electron-updater"]
    commit-message:
      prefix: "chore(desktop)"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # Same reason as the app tree: types ahead of the node floor lie quietly.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(toolchain)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
