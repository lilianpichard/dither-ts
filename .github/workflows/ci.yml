name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
            electron/package-lock.json
      - run: npm ci
      - run: npm ci --prefix app
      - run: npm ci --prefix electron
      - run: npm run typecheck
      - run: npm --prefix app run typecheck
      - run: npm run test:all
      - run: npm run coverage:all
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build:all
      - name: No absolute asset paths (Electron file:// compat)
        run: |
          if grep -Eq '(src|href)="/' app/dist/index.html; then
            echo "absolute asset path breaks file:// loading"; exit 1
          fi
      # --no-sandbox: runners lack the SUID sandbox helper setup.
      - run: npm --prefix electron exec -- electron --no-sandbox --version
      - name: Package and smoke the desktop app
        # electron-builder ships chrome-sandbox without the setuid bit, and
        # Electron aborts at startup rather than falling back to no-sandbox, so
        # the packaged app needs the same escape hatch the version check above
        # uses. Opt-in via the env var, so real installs keep the sandbox.
        env:
          DITHER_SMOKE_ARGS: --no-sandbox
        run: |
          if command -v xvfb-run >/dev/null 2>&1; then
            xvfb-run -a npm --prefix electron run smoke
          else
            npm --prefix electron run smoke
          fi
