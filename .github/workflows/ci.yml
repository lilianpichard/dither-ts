name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx prettier --check .
      - run: npx oxlint
      - run: npm ci --prefix app
      - run: npm --prefix app run typecheck
      - run: npm --prefix app test -- --run
      - run: npm --prefix app run build
      - name: No absolute asset paths (Electron file:// compat)
        run: |
          if grep -Eq '(src|href)="/' app/dist/index.html; then
            echo "absolute asset path breaks file:// loading"; exit 1
          fi
      - run: npm ci --prefix electron
      # --no-sandbox: runners lack the SUID sandbox helper setup.
      - run: npx --prefix electron electron --no-sandbox --version
