name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository, so the token gets nothing to write with.
permissions:
  contents: read

# A newer push to the same ref supersedes the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
            electron/package-lock.json
      - run: npm ci
      - run: npm ci --prefix app
      - run: npm ci --prefix electron
      - run: npm audit --audit-level=high
      - run: npm --prefix app run typecheck
      - run: npm run typecheck
      - run: npm run test:all
      - run: npm run coverage:all
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build:all
      - name: The package a consumer would install
        # Catches a broken entry point or a files list that drops dist, which
        # is invisible until someone tries npm install dither-ts.
        run: npm run pack:check
      - name: No absolute asset paths (Electron file:// compat)
        run: |
          if grep -Eq '(src|href)="/' app/dist/index.html; then
            echo "absolute asset path breaks file:// loading"; exit 1
          fi

  # Packaging is the slowest step and depends on nothing but one node version,
  # so it runs once instead of once per version in the matrix.
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
            electron/package-lock.json
      - run: npm ci
      - run: npm ci --prefix app
      - run: npm ci --prefix electron
      - run: npm --prefix electron exec -- electron --no-sandbox --version
      - name: Package and smoke the desktop app
        # electron-builder ships chrome-sandbox without the setuid bit, and
        # Electron aborts at startup rather than falling back to no-sandbox, so
        # the packaged app needs the same escape hatch the version check above
        # uses. Opt-in via the env var, so real installs keep the sandbox.
        env:
          DITHER_SMOKE_ARGS: --no-sandbox
        run: |
          if command -v xvfb-run >/dev/null 2>&1; then
            xvfb-run -a npm --prefix electron run smoke
          else
            npm --prefix electron run smoke
          fi
