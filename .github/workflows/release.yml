name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and publish, for example v0.1.0
        required: true

# The publish step is the only one here that writes anything.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # One entry per platform, because the three builders need three runners.
  desktop:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            target: AppImage deb
          - platform: mac
            os: macos-latest
            target: dmg zip
          - platform: win
            os: windows-latest
            target: nsis
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
            electron/package-lock.json
      - run: npm ci
      - run: npm ci --prefix app
      - run: npm ci --prefix electron
      - name: Build the desktop artifacts
        # The dist script builds the web app, copies it into electron/dist and
        # then packages, so this is the same path the smoke test exercises.
        # --publish never: the publish job below creates one release, so three
        # builders racing to create it would leave the update feed incomplete.
        run: npm --prefix electron run dist -- --${{ matrix.platform }} ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dither-ts-${{ matrix.platform }}
          path: electron/release/*
          if-no-files-found: error
          retention-days: 7

  # Everything lands in one release, so the update feed and the download links
  # come from a single job rather than three racing ones.
  publish:
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dither-ts-*
          merge-multiple: true
          path: artifacts
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # latest*.yml is the updater feed. It has to travel with the
          # artifacts or every installed app reports itself up to date forever.
          test -n "$(ls artifacts/latest*.yml)" || {
            echo "no update feed in the artifacts"; exit 1;
          }
          gh release create "$TAG" artifacts/* \
            --title "dither-ts $TAG" \
            --generate-notes \
            --verify-tag
