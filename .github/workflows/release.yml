name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and publish, for example v0.1.0
        required: true

# The publish step is the only one here that writes anything.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # One matrix entry per platform, because signing material does not cross over:
  # a macOS certificate means nothing on a Windows runner.
  desktop:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            target: AppImage deb
            link: LINUX_CSC_LINK
            password: LINUX_CSC_KEY_PASSWORD
          - platform: mac
            os: macos-latest
            target: dmg zip
            link: MAC_CSC_LINK
            password: MAC_CSC_KEY_PASSWORD
          - platform: win
            os: windows-latest
            target: nsis
            link: WIN_CSC_LINK
            password: WIN_CSC_KEY_PASSWORD
    env:
      # electron-builder reads one variable name on every platform, so each
      # entry supplies only its own certificate. An empty value means unsigned,
      # which still produces an artifact rather than failing the release.
      CSC_LINK: ${{ secrets[matrix.link] }}
      CSC_KEY_PASSWORD: ${{ secrets[matrix.password] }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
            electron/package-lock.json
      - run: npm ci
      - run: npm ci --prefix app
      - run: npm ci --prefix electron
      - name: Build the desktop artifacts
        # The dist script builds the web app, copies it into electron/dist and
        # then packages, so this is the same path the smoke test exercises.
        # --publish never: the publish job below creates one release, so three
        # builders racing to create it would leave the update feed incomplete.
        run: npm --prefix electron run dist -- --${{ matrix.platform }} ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dither-ts-${{ matrix.platform }}
          path: electron/release/*
          if-no-files-found: error
          retention-days: 7

  # Everything lands in one release, so the update feed and the download links
  # come from a single job rather than three racing ones.
  publish:
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dither-ts-*
          merge-multiple: true
          path: artifacts
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # latest*.yml is the updater feed. It has to travel with the
          # artifacts or every installed app reports itself up to date forever.
          test -n "$(ls artifacts/latest*.yml)" || {
            echo "no update feed in the artifacts"; exit 1;
          }
          gh release create "$TAG" artifacts/* \
            --title "dither-ts $TAG" \
            --generate-notes \
            --verify-tag
