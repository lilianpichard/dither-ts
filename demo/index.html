<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>dither-ts canvas demo</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  canvas { border: 1px solid #ccc; max-width: 48%; }
  #status { color: #555; }
</style>
</head>
<body>
<h3>dither-ts</h3>
<div class="row">
  <input type="file" id="f" accept="image/*">
  <select id="m">
    <option value="ordered">ordered (Bayer 4x4)</option>
    <option value="floyd">floyd (Floyd-Steinberg)</option>
    <option value="atkinson">atkinson</option>
  </select>
  <label>threshold <input type="range" id="t" min="1" max="254" value="128"><span id="tv">128</span></label>
  <button id="go" disabled>Process</button>
</div>
<div class="row">
  <canvas id="orig"></canvas>
  <canvas id="out"></canvas>
</div>
<p id="status">1) run a local server from the project root, 2) open the served URL, 3) choose an image, 4) press Process.</p>
<script type="module">
import { orderedBW, floydSteinberg, atkinson, grayscaleFromRGB } from '../dist/src/index.js';
const f = document.getElementById('f');
const m = document.getElementById('m');
const t = document.getElementById('t');
const tv = document.getElementById('tv');
const go = document.getElementById('go');
const orig = document.getElementById('orig');
const out = document.getElementById('out');
const status = document.getElementById('status');
let bmp = null;

t.oninput = () => { tv.textContent = t.value; if (bmp) run(); };
m.onchange = () => { if (bmp) run(); };
f.onchange = async () => {
  if (!f.files[0]) return;
  bmp = await createImageBitmap(f.files[0]);
  orig.width = out.width = bmp.width;
  orig.height = out.height = bmp.height;
  orig.getContext('2d').drawImage(bmp, 0, 0);
  go.disabled = false;
  status.textContent = 'Image loaded. Press Process (or change method/threshold to re-run).';
  run();
};
go.onclick = run;

function run() {
  if (!bmp) return;
  const w = bmp.width, h = bmp.height;
  const ctx = orig.getContext('2d');
  const d = ctx.getImageData(0, 0, w, h);
  const rgb = new Uint8ClampedArray(w * h * 3);
  for (let i = 0; i < w * h; i++) { rgb[i*3]=d.data[i*4]; rgb[i*3+1]=d.data[i*4+1]; rgb[i*3+2]=d.data[i*4+2]; }
  const g = grayscaleFromRGB(rgb, w, h);
  const th = parseInt(t.value, 10);
  const t0 = performance.now();
  const o = m.value === 'floyd' ? floydSteinberg(g, th) : m.value === 'atkinson' ? atkinson(g, th) : orderedBW(g, 'Bayer 4x4', th);
  const octx = out.getContext('2d');
  const od = octx.createImageData(w, h);
  for (let i = 0; i < o.length; i++) { od.data[i*4]=od.data[i*4+1]=od.data[i*4+2]=o[i]; od.data[i*4+3]=255; }
  octx.putImageData(od, 0, 0);
  status.textContent = `Done: ${m.value} th=${th} in ${(performance.now()-t0).toFixed(1)}ms`;
}
</script>
</body>
</html>
