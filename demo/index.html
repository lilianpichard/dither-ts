<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>dither-ts canvas demo</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 16px;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }
      canvas {
        border: 1px solid #ccc;
        max-width: 48%;
      }
      #status {
        color: #555;
      }
    </style>
  </head>
  <body>
    <h3>dither-ts</h3>
    <div class="row">
      <input type="file" id="f" accept="image/*" />
      <select id="m"></select>
      <label><input type="checkbox" id="c" /> color</label>
      <select id="p"></select>
      <label
        >threshold <input type="range" id="t" min="1" max="254" value="128" /><span id="tv"
          >128</span
        ></label
      >
      <label
        >pixel size <input type="range" id="s" min="1" max="8" value="1" /><span id="sv"
          >1</span
        ></label
      >
      <button id="go" disabled>Process</button>
    </div>
    <div class="row">
      <canvas id="orig"></canvas>
      <canvas id="out"></canvas>
    </div>
    <p id="status">
      1) run a local server from the project root, 2) open the served URL, 3) choose an image, 4)
      press Process.
    </p>
    <script type="module">
      import {
        METHOD_NAMES,
        PALETTES,
        ditherColor,
        ditherGray,
        grayscaleFromRGB,
      } from "../dist/src/index.js";
      const f = document.getElementById("f");
      const m = document.getElementById("m");
      const c = document.getElementById("c");
      const p = document.getElementById("p");
      const t = document.getElementById("t");
      const tv = document.getElementById("tv");
      const s = document.getElementById("s");
      const sv = document.getElementById("sv");
      const go = document.getElementById("go");
      const orig = document.getElementById("orig");
      const out = document.getElementById("out");
      const status = document.getElementById("status");
      let bmp = null;

      for (const name of METHOD_NAMES) {
        const o = document.createElement("option");
        o.value = o.textContent = name;
        if (name === "Floyd-Steinberg") o.selected = true;
        m.appendChild(o);
      }
      for (const name of Object.keys(PALETTES)) {
        const o = document.createElement("option");
        o.value = o.textContent = name;
        if (name === "GameBoy") o.selected = true;
        p.appendChild(o);
      }

      t.oninput = () => {
        tv.textContent = t.value;
        if (bmp) run();
      };
      s.oninput = () => {
        sv.textContent = s.value;
        if (bmp) run();
      };
      m.onchange = () => {
        if (bmp) run();
      };
      c.onchange = () => {
        if (bmp) run();
      };
      p.onchange = () => {
        if (bmp) run();
      };
      f.onchange = async () => {
        if (!f.files[0]) return;
        bmp = await createImageBitmap(f.files[0]);
        orig.width = out.width = bmp.width;
        orig.height = out.height = bmp.height;
        orig.getContext("2d").drawImage(bmp, 0, 0);
        go.disabled = false;
        status.textContent = "Image loaded. Press Process (or change a setting to re-run).";
        run();
      };
      go.onclick = run;

      function run() {
        if (!bmp) return;
        const w = bmp.width,
          h = bmp.height;
        const ctx = orig.getContext("2d");
        const d = ctx.getImageData(0, 0, w, h);
        const rgb = new Uint8ClampedArray(w * h * 3);
        for (let i = 0; i < w * h; i++) {
          rgb[i * 3] = d.data[i * 4];
          rgb[i * 3 + 1] = d.data[i * 4 + 1];
          rgb[i * 3 + 2] = d.data[i * 4 + 2];
        }
        const th = parseInt(t.value, 10);
        const px = parseInt(s.value, 10);
        const t0 = performance.now();
        const octx = out.getContext("2d");
        const od = octx.createImageData(w, h);
        if (c.checked) {
          const o = ditherColor(rgb, w, h, {
            method: m.value,
            palette: p.value,
            pixelSize: px,
          });
          for (let i = 0; i < w * h; i++) {
            od.data[i * 4] = o[i * 3];
            od.data[i * 4 + 1] = o[i * 3 + 1];
            od.data[i * 4 + 2] = o[i * 3 + 2];
            od.data[i * 4 + 3] = 255;
          }
        } else {
          const g = grayscaleFromRGB(rgb, w, h);
          const o = ditherGray(g, { method: m.value, threshold: th, pixelSize: px });
          for (let i = 0; i < o.length; i++) {
            od.data[i * 4] = od.data[i * 4 + 1] = od.data[i * 4 + 2] = o[i];
            od.data[i * 4 + 3] = 255;
          }
        }
        octx.putImageData(od, 0, 0);
        status.textContent =
          `Done: ${m.value} ${c.checked ? `color/${p.value}` : `bw th=${th}`} px=${px} ` +
          `in ${(performance.now() - t0).toFixed(1)}ms`;
      }
    </script>
  </body>
</html>
